<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>醫療資訊查詢系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; }
    .nav { background: #0066cc; display: flex; gap: 4px; padding: 12px 24px; }
    .nav button { background: transparent; color: #fff; border: 2px solid transparent; border-radius: 4px; padding: 8px 20px; font-size: 15px; cursor: pointer; }
    .nav button.active { border-color: #fff; background: rgba(255,255,255,0.15); }
    .page { display: none; padding: 24px; max-width: 800px; margin: 0 auto; }
    .page.active { display: block; }
    h1 { margin-bottom: 20px; font-size: 22px; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select { padding: 8px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
    input { flex: 1; min-width: 200px; }
    button.btn { padding: 8px 20px; font-size: 15px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button.btn:hover { background: #0052a3; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: box-shadow 0.15s; }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h3 { font-size: 16px; margin-bottom: 6px; }
    .card p { font-size: 14px; color: #555; margin: 2px 0; }
    .tag { display: inline-block; background: #e0f0ff; color: #0066cc; border-radius: 3px; padding: 2px 8px; font-size: 12px; margin-right: 6px; }
    .warn { background: #fff3cd; border-radius: 4px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
    .detail { background: #fff; border: 1px solid #aaa; border-radius: 6px; padding: 16px; margin-top: 16px; }
    .detail h2 { margin-bottom: 10px; }
    .detail ul { padding-left: 20px; margin: 6px 0 12px; }
    #status, #drug-status { color: #888; margin-bottom: 12px; font-size: 14px; }
    .pagination { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  </style>
</head>
<body>

<div class="nav">
  <button class="active" onclick="showPage('hospital')">🏥 醫療院所查詢</button>
  <button onclick="showPage('drug')">💊 藥物查詢</button>
</div>

<!-- 醫療院所 -->
<div id="page-hospital" class="page active">
  <h1>健保醫療院所查詢</h1>
  <div class="search-bar">
    <input id="keyword" placeholder="輸入醫院名稱或地址..." onkeydown="if(event.key==='Enter')searchHospital()" />
    <select id="city">
      <option value="">全部縣市</option>
      <option>台北市</option><option>新北市</option><option>桃園市</option>
      <option>台中市</option><option>台南市</option><option>高雄市</option>
      <option>基隆市</option><option>新竹市</option><option>嘉義市</option>
    </select>
    <select id="type">
      <option value="">全部類型</option>
      <option value="1">醫學中心</option><option value="2">區域醫院</option>
      <option value="3">地區醫院</option><option value="4">診所</option>
      <option value="5">藥局</option>
    </select>
    <button class="btn" onclick="searchHospital()">搜尋</button>
  </div>
  <div id="status"></div>
  <div id="hospital-results"></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- 藥物查詢 -->
<div id="page-drug" class="page">
  <h1>藥物查詢</h1>
  <div class="search-bar">
    <input id="drug-keyword" placeholder="輸入藥名搜尋..." onkeydown="if(event.key==='Enter')searchDrug()" />
    <button class="btn" onclick="searchDrug()">搜尋</button>
  </div>
  <div id="drug-status"></div>
  <div id="drug-results"></div>
  <div id="drug-detail"></div>
</div>

<script>
  // --- 頁籤切換 ---
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    event.target.classList.add('active');
  }

  // --- 醫療院所 ---
  const TYPE_MAP = {'1':'醫學中心','2':'區域醫院','3':'地區醫院','4':'診所','5':'藥局','6':'居家護理','7':'康復之家','8':'助產所','9':'檢驗所'};

  async function searchHospital(page = 1) {
    const keyword = document.getElementById('keyword').value.trim();
    const city = document.getElementById('city').value;
    const type = document.getElementById('type').value;
    document.getElementById('status').textContent = '查詢中...';
    document.getElementById('hospital-results').innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    try {
      const params = new URLSearchParams({ rId: 'A21030000I-D21005-001', page, pageSize: 20 });
      if (keyword) params.append('HOSP_NAME', keyword);
      if (city) params.append('CNTY', city);
      if (type) params.append('HOSP_GRADE', type);
      const res = await fetch(`https://info.nhi.gov.tw/IODE0000/IODE0000S06?${params}`);
      const data = await res.json();
      const records = data.result?.records || [];
      const total = data.result?.count || records.length;
      document.getElementById('status').textContent = `共找到 ${total} 筆，第 ${page} 頁`;
      document.getElementById('hospital-results').innerHTML = records.map(r => `
        <div class="card">
          <h3>${r.HOSP_NAME || '-'} <span class="tag">${TYPE_MAP[r.HOSP_GRADE] || '-'}</span></h3>
          <p>📍 ${r.CNTY || ''}${r.TOWN || ''} ${r.HOSP_ADDR || '-'}</p>
          <p>📞 ${r.HOSP_TEL || '-'}</p>
        </div>`).join('');
      const totalPages = Math.ceil(total / 20);
      if (totalPages > 1) {
        document.getElementById('pagination').innerHTML =
          (page > 1 ? `<button class="btn" onclick="searchHospital(${page-1})">上一頁</button>` : '') +
          `<span>${page} / ${totalPages}</span>` +
          (page < totalPages ? `<button class="btn" onclick="searchHospital(${page+1})">下一頁</button>` : '');
      }
    } catch(e) {
      document.getElementById('status').textContent = '查詢失敗，請稍後再試';
    }
  }

  // --- 藥物資料 ---
  const DRUGS = [
    { id:1, name:'阿斯匹靈 (Aspirin)', description:'止痛、退燒、抗發炎藥物', dosage:'成人：每次 325–650mg，每4–6小時一次，每日不超過 4g', side_effects:['胃部不適','出血風險','耳鳴'] },
    { id:2, name:'布洛芬 (Ibuprofen)', description:'非類固醇消炎止痛藥', dosage:'成人：每次 200–400mg，每4–6小時一次，每日不超過 1200mg', side_effects:['胃痛','噁心','頭暈'] },
    { id:3, name:'華法林 (Warfarin)', description:'抗凝血劑', dosage:'依個人 INR 值由醫師調整，通常每日 2–10mg，需定期抽血監測', side_effects:['出血','瘀傷','頭痛'], food_interactions:['深綠色蔬菜（菠菜、花椰菜）— 含維生素K，會降低藥效','葡萄柚 — 影響藥物代謝','酒精 — 增加出血風險'] },
    { id:4, name:'普拿疼 (Paracetamol)', description:'退燒止痛藥，適用於輕至中度疼痛及發燒，是最常見的非處方止痛藥之一', dosage:'成人：每次 500–1000mg，每4–6小時一次，每日不超過 4g', side_effects:['肝臟損傷（過量）','噁心','嘔吐','皮膚過敏反應','腎臟損傷（長期大量使用）'] },
    { id:5, name:'二甲雙胍 (Metformin)', description:'第二型糖尿病用藥', dosage:'成人起始劑量：每次 500mg，每日2次，隨餐服用；最大劑量每日 2550mg', side_effects:['腸胃不適','噁心','腹瀉'], food_interactions:['酒精 — 增加乳酸酸中毒風險','高糖食物 — 影響血糖控制效果'] },
    { id:6, name:'贊安諾 (Alprazolam)', description:'苯二氮平類藥物，用於治療焦慮症與恐慌症', dosage:'成人：每次 0.25–0.5mg，每日3次；依醫師指示調整，最大劑量每日 4mg', side_effects:['嗜睡','頭暈','記憶障礙','依賴性','呼吸抑制'] },
    { id:7, name:'安定文 (Diazepam)', description:'苯二氮平類藥物，用於治療焦慮症、肌肉痙攣、癲癇及酒精戒斷症狀', dosage:'成人焦慮：每次 2–10mg，每日2–4次；癲癇急救：靜脈注射 5–10mg，依醫師指示', side_effects:['嗜睡','疲倦','肌肉無力','記憶障礙','依賴性','呼吸抑制（大劑量）'] },
    { id:8, name:'嗎啡 (Morphine)', description:'強效鴉片類止痛藥，用於重度疼痛', dosage:'成人：口服 10–30mg，每4小時一次；依醫師指示調整', side_effects:['呼吸抑制','噁心','便秘','嗜睡','依賴性'] },
    { id:9, name:'酒精 (Alcohol)', description:'中樞神經抑制劑，與多種藥物有嚴重交互作用', dosage:'N/A', side_effects:['中樞神經抑制','肝臟損傷','依賴性'] },
    { id:10, name:'氟西汀 (Fluoxetine/百憂解)', description:'選擇性血清素回收抑制劑（SSRI），用於治療憂鬱症與焦慮症', dosage:'成人：每日 20–60mg，早上服用', side_effects:['噁心','失眠','頭痛','性功能障礙','躁動'] },
    { id:11, name:'立拔癲 (Levetiracetam)', description:'抗癲癇藥物，用於治療部分性發作、肌陣攣癲癇及強直陣攣性發作', dosage:'成人起始：每次 500mg，每日2次；依療效調整至每次 1500mg，每日2次，最大劑量每日 3000mg', side_effects:['嗜睡','頭暈','疲倦','行為改變（易怒、攻擊性）','感染風險增加'] },
    { id:12, name:'普萘洛爾 (Propranolol/心律錠)', description:'乙型阻斷劑，用於治療自律神經失調、心悸、高血壓及焦慮引起的身體症狀', dosage:'自律神經：每次 10–40mg，每日2–3次；依醫師指示調整', side_effects:['心跳過緩','低血壓','疲倦','手腳冰冷','支氣管收縮（氣喘患者禁用）'] },
    { id:13, name:'克癇平 (Clonazepam)', description:'苯二氮平類藥物，用於治療自律神經失調、焦慮症及癲癇', dosage:'成人焦慮：每次 0.25–0.5mg，每日2次；依醫師指示調整，最大劑量每日 4mg', side_effects:['嗜睡','頭暈','記憶障礙','依賴性','協調障礙'] },
    { id:14, name:'多慮平 (Doxepin)', description:'三環抗憂鬱劑，用於治療自律神經失調伴隨的焦慮與憂鬱', dosage:'成人：每日 25–150mg，睡前服用；依醫師指示調整', side_effects:['嗜睡','口乾','便秘','視力模糊','心律不整'] },
    { id:15, name:'甲氧氯普胺 (Metoclopramide/胃復安)', description:'自律神經調節藥物，促進腸胃蠕動，用於噁心、嘔吐及胃排空障礙', dosage:'成人：每次 10mg，餐前30分鐘服用，每日3次', side_effects:['嗜睡','錐體外症狀（長期使用）','焦躁','腹瀉'] },
    { id:16, name:'安利富 (Clomipramine/Anafranil)', description:'三環抗憂鬱劑，用於治療強迫症（OCD）、憂鬱症、恐慌症及慢性疼痛', dosage:'成人起始：每日 25mg，逐漸增加至每日 100–250mg；分次服用，依醫師指示調整', side_effects:['口乾','便秘','嗜睡','視力模糊','心律不整','體重增加','直立性低血壓','排尿困難'] },
    { id:17, name:'維他命K (Vitamin K/Phytonadione)', description:'Warfarin（抗凝血劑）的拮抗劑，用於逆轉 Warfarin 過量造成的出血風險。也是凝血因子合成所需的必要營養素', dosage:'Warfarin 拮抗（口服）：2.5–10mg，依 INR 值由醫師調整；嚴重出血（靜脈注射）：10mg，緩慢注射，依醫師指示', side_effects:['注射部位反應','靜脈注射過快可能引起過敏反應','大劑量可能造成溶血（新生兒）'], food_interactions:['菠菜、花椰菜、羽衣甘藍等深綠色蔬菜含大量維他命K，大量食用會影響 Warfarin 藥效','納豆含極高量維他命K，服用 Warfarin 期間應避免食用'] },
  ];
  const INTERACTIONS = [
    { a:1, b:3, desc:'Aspirin 與 Warfarin 合用會增加出血風險' },
    { a:2, b:3, desc:'Ibuprofen 與 Warfarin 合用會增加出血風險' },
    { a:6, b:4, desc:'贊安諾與普拿疼合用可能加重中樞神經抑制' },
    { a:6, b:3, desc:'贊安諾與 Warfarin 合用可能影響抗凝血效果' },
    { a:7, b:6, desc:'安定文與贊安諾同屬苯二氮平類，合用會加重中樞神經抑制、嗜睡與呼吸抑制風險' },
    { a:7, b:4, desc:'安定文與普拿疼合用需注意中樞神經抑制加重' },
    { a:7, b:8, desc:'安定文與嗎啡合用會嚴重加重呼吸抑制，可能危及生命' },
    { a:7, b:9, desc:'安定文與酒精合用會大幅加重中樞神經抑制、嗜睡與呼吸抑制，禁止合用' },
    { a:7, b:10, desc:'安定文與百憂解合用可能增加安定文血中濃度，加重鎮靜效果' },
    { a:7, b:2, desc:'安定文與布洛芬合用需注意中樞神經抑制輕微加重' },
    { a:11, b:7, desc:'立拔癲與安定文合用可能加重中樞神經抑制與嗜睡' },
    { a:11, b:9, desc:'立拔癲與酒精合用會加重中樞神經抑制，應避免飲酒' },
    { a:12, b:7, desc:'心律錠與安定文合用可能加重低血壓與心跳過緩' },
    { a:12, b:9, desc:'心律錠與酒精合用會加重低血壓' },
    { a:13, b:7, desc:'克癇平與安定文同屬苯二氮平類，合用嚴重加重中樞神經抑制' },
    { a:13, b:6, desc:'克癇平與贊安諾同屬苯二氮平類，合用加重呼吸抑制風險' },
    { a:14, b:7, desc:'多慮平與安定文合用加重中樞神經抑制與嗜睡' },
    { a:14, b:9, desc:'多慮平與酒精合用嚴重加重中樞神經抑制' },
    { a:15, b:7, desc:'胃復安與安定文合用可能加重嗜睡' },
    { a:16, b:10, desc:'安利富與百憂解合用會增加血清素症候群風險，嚴重可危及生命' },
    { a:16, b:7, desc:'安利富與安定文合用加重中樞神經抑制與心律不整風險' },
    { a:16, b:9, desc:'安利富與酒精合用嚴重加重中樞神經抑制' },
    { a:16, b:3, desc:'安利富與 Warfarin 合用可能增強抗凝血效果，提高出血風險' },
    { a:16, b:6, desc:'安利富與贊安諾合用加重鎮靜與心律不整風險' },
    { a:17, b:3, desc:'維他命K 是 Warfarin 的拮抗劑，可逆轉 Warfarin 的抗凝血效果，用於處理 Warfarin 過量出血' },
    { a:17, b:1, desc:'維他命K 與 Aspirin 合用需監測凝血功能' },
    { a:4, b:3, desc:'普拿疼與 Warfarin 長期合用可能增強抗凝血效果，提高出血風險' },
    { a:4, b:5, desc:'普拿疼與 Metformin 合用需注意腎功能，腎功能不佳者風險較高' },
  ];

  function searchDrug() {
    const q = document.getElementById('drug-keyword').value.trim().toLowerCase();
    document.getElementById('drug-detail').innerHTML = '';
    if (!q) { document.getElementById('drug-status').textContent = '請輸入藥名'; return; }
    const results = DRUGS.filter(d => d.name.toLowerCase().includes(q));
    document.getElementById('drug-status').textContent = `找到 ${results.length} 筆`;
    document.getElementById('drug-results').innerHTML = results.map(d => `
      <div class="card" onclick="showDrug(${d.id})">
        <h3>${d.name}</h3>
        <p>${d.description}</p>
      </div>`).join('') || '<p>查無資料</p>';
  }

  function showDrug(id) {
    const drug = DRUGS.find(d => d.id === id);
    if (!drug) return;
    const interactions = INTERACTIONS
      .filter(i => i.a === id || i.b === id)
      .map(i => {
        const otherId = i.a === id ? i.b : i.a;
        const other = DRUGS.find(d => d.id === otherId);
        return `<div class="warn">⚠️ <strong>${other?.name}</strong>：${i.desc}</div>`;
      }).join('');
    const foodSection = drug.food_interactions?.length
      ? `<h3>食物交互作用</h3>${drug.food_interactions.map(f => `<div class="warn">🍽️ ${f}</div>`).join('')}`
      : '';
    const dosageSection = drug.dosage
      ? `<h3 style="margin-top:12px">建議劑量</h3><div class="warn" style="background:#e8f5e9">💊 ${drug.dosage}</div><p style="font-size:12px;color:#888;margin-top:4px">※ 實際用藥請遵照醫師或藥師指示</p>`
      : '';
    document.getElementById('drug-detail').innerHTML = `
      <div class="detail">
        <h2>${drug.name}</h2>
        <p>${drug.description}</p>
        ${dosageSection}
        <h3 style="margin-top:12px">副作用</h3>
        <ul>${drug.side_effects.map(e => `<li>${e}</li>`).join('')}</ul>
        <h3>藥物交互作用</h3>
        ${interactions || '<p>無已知交互作用</p>'}
        ${foodSection}
      </div>`;
  }

  // 預設載入醫院
  searchHospital();
</script>
</body>
</html>
